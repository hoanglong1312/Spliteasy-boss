<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Spliteasy — Tính tiền nhóm</title>
<link rel="stylesheet" href="src/vb-tokens.css"/>
<style>
  html, body, #root {
    margin: 0; padding: 0;
    width: 100%; height: 100vh;
    overflow: hidden;
    background: #ECEEF3;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(1200px 600px at 30% -10%, #DCDFEC 0%, transparent 60%),
      radial-gradient(900px 500px at 80% 110%, #E4D9FA 0%, transparent 60%),
      #ECEEF3;
  }
  #root {
    display: flex; align-items: center; justify-content: center;
  }
  /* Hide scrollbars inside the phone */
  .screen-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .screen-scroll { scrollbar-width: none; }
  .screen-scroll *::-webkit-scrollbar { width: 0; height: 0; }
  .screen-scroll * { scrollbar-width: none; }

  @keyframes st-fwd {
    from { transform: translateX(12%); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }
  @keyframes st-back {
    from { transform: translateX(-12%); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }
  @keyframes st-fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .screen-anim-fwd { animation: st-fwd .32s cubic-bezier(.2,.7,.2,1) both; }
  .screen-anim-back { animation: st-back .32s cubic-bezier(.2,.7,.2,1) both; }
  .screen-anim-fade { animation: st-fade .24s ease-out both; }
  * { box-sizing: border-box; }
</style>
</head>
<body style="font-family: Inter">
<div id="root"></div>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Tweaks panel + iOS frame helpers -->
<script type="text/babel" src="src/tweaks-panel.jsx"></script>
<script type="text/babel" src="src/ios-frame.jsx"></script>

<!-- Data + primitives -->
<script type="text/babel" src="src/data.jsx"></script>
<script type="text/babel" src="src/store.jsx"></script>
<script type="text/babel" src="src/components.jsx"></script>

<!-- Screens -->
<script type="text/babel" src="src/screen-home.jsx"></script>
<script type="text/babel" src="src/screen-groups.jsx"></script>
<script type="text/babel" src="src/screen-pickleball.jsx"></script>
<script type="text/babel" src="src/screen-profile.jsx"></script>

<!-- App entry -->
<script type="text/babel" src="src/app.jsx"></script>

</body>
</html>
