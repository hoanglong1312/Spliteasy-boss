<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Spliteasy — Tính tiền nhóm</title>
<style>
  html, body, #root {
    margin: 0; padding: 0;
    width: 100%; height: 100vh;
    overflow: hidden;
    background: #0f1117;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0f1117;
  }
  #root {
    display: flex; align-items: center; justify-content: center;
  }
  /* Hide scrollbars inside the phone */
  .screen-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .screen-scroll { scrollbar-width: none; }
  .screen-scroll *::-webkit-scrollbar { width: 0; height: 0; }
  .screen-scroll * { scrollbar-width: none; }

  @keyframes st-fwd {
    from { transform: translateX(12%); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }
  @keyframes st-back {
    from { transform: translateX(-12%); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }
  @keyframes st-fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .screen-anim-fwd { animation: st-fwd .32s cubic-bezier(.2,.7,.2,1) both; }
  .screen-anim-back { animation: st-back .32s cubic-bezier(.2,.7,.2,1) both; }
  .screen-anim-fade { animation: st-fade .24s ease-out both; }
  * { box-sizing: border-box; }
  :root { --screen-top: 44px; --safe-bottom: 0px; --tab-bar-height: 68px; }
@media (max-width: 500px) {
  /* position:fixed on #root: iOS keyboard cannot shift a fixed element, so window.scrollY won't move the UI */
  #root { position: fixed; top: 0; left: 0; right: 0; bottom: 0; height: auto; }
  :root { --screen-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom); }
  [data-spliteasy-phone-frame] {
    width: 100% !important;
    height: 100dvh !important;
    max-height: none !important;
    margin: 0 !important;
    border-radius: 0 !important;
    border: none !important;
    box-shadow: none !important;
  }
  [data-spliteasy-status-bar] {
    display: none !important;
  }
}
@media (display-mode: standalone) {
  :root { --safe-bottom: env(safe-area-inset-bottom); }
}
</style>
</head>
<body style="font-family: Geist, Inter, -apple-system, BlinkMacSystemFont, sans-serif">
<div id="root"></div>

<script>
  /* iOS PWA (navigator.standalone) không bắt được bởi display-mode: standalone media query */
  if (window.navigator.standalone === true) {
    document.documentElement.style.setProperty('--safe-bottom', 'env(safe-area-inset-bottom)');
  }
</script>
<script type="module" src="/src/main.jsx"></script>

</body>
</html>
