<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Spliteasy — Tính tiền nhóm</title>
<style>
  html, body, #root {
    margin: 0; padding: 0;
    width: 100%; height: 100vh;
    overflow: hidden;
    background: #0f1117;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0f1117;
  }
  #root {
    display: flex; align-items: center; justify-content: center;
  }
  /* Hide scrollbars inside the phone */
  .screen-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .screen-scroll { scrollbar-width: none; }
  .screen-scroll *::-webkit-scrollbar { width: 0; height: 0; }
  .screen-scroll * { scrollbar-width: none; }

  @keyframes st-fwd {
    from { transform: translateX(12%); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }
  @keyframes st-back {
    from { transform: translateX(-12%); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }
  @keyframes st-fade {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .screen-anim-fwd { animation: st-fwd .32s cubic-bezier(.2,.7,.2,1) both; }
  .screen-anim-back { animation: st-back .32s cubic-bezier(.2,.7,.2,1) both; }
  .screen-anim-fade { animation: st-fade .24s ease-out both; }
  * { box-sizing: border-box; }
@media (max-width: 430px) {
  [data-spliteasy-phone-frame] {
    width: 100% !important;
    height: 100dvh !important;
    margin: 0 !important;
    border-radius: 0 !important;
    border: none !important;
    box-shadow: none !important;
  }
}
</style>
</head>
<body style="font-family: Inter">
<div id="root"></div>

<script type="module" src="/src/main.jsx"></script>

</body>
</html>
